Assignment scope:

A wallet contains:

```text
id
ownerName
balance
status
createdAt
```

Wallet statuses:

```text
ACTIVE
CLOSED
```

Required operations later:

```text
Create wallet
Get wallet by ID
Get all wallets
Deposit money
Withdraw money
Close wallet
```

Business decisions so far:

* One owner may have multiple wallets.
* `balance` uses Java `BigDecimal`.
* PostgreSQL should use an exact numeric type such as `NUMERIC(19,2)`.
* IDs will use a PostgreSQL sequence.
* `createdAt` will initially be assigned in the service using `LocalDateTime.now()`.
* Money-changing operations will use service-layer transactions.
* We may later use pessimistic locking for concurrent withdrawals, but do not implement that yet.

